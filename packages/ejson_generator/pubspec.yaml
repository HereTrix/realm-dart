name: ejson_generator
description: >-
  EJSON serialization.

  BSON is a binary format used to store JSON-like documents efficiently.
  EJSON extends JSON defining how all BSON types should be represented in JSON.

topics:
  - ejson
  - bson
  - json
  - build-runner
  - codegen

version: 0.4.0
repository: https://github.com/realm/realm-dart/ejson/packages/ejson_generator

environment:
  sdk: ^3.12.0

dependencies:
  analyzer: ^14.6.0
  build: '>=4.0.4 <6.0.0'
  ejson_analyzer: ^0.4.1
  source_gen: ^4.3.1

dev_dependencies:
  build_runner: ^2.16.2
  build_test: ^3.5.23
  dart_style: ^3.1.14
  ejson: ^0.4.0
  ejson_annotation: ^0.4.0
  lints: ^6.1.0
  logging: ^1.2.0
  meta: ^1.15.0
  test: ^1.33.0
  pub_semver: ^2.2.0
